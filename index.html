<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>디시 아카이브</title><style>body{margin:0;background:#11151d;color:#e5eaf2;font:16px/1.75 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px}a{color:#9bc8ff;text-decoration:none}a:hover{text-decoration:underline}h1{font-size:27px;line-height:1.4}header,footer{color:#a9b5c9;margin:20px 0}article{overflow-wrap:anywhere}article img,article video{max-width:100%;height:auto}article table{max-width:100%;overflow:auto;display:block}li.post{padding:14px 0;border-bottom:1px solid #2b3342;list-style:none}.meta{font-size:13px;color:#9ba9bd}ul{padding-left:20px}ul.posts{padding:0}nav{display:flex;gap:16px;flex-wrap:wrap;padding:20px 0}input{width:min(90%,500px);padding:12px;background:#1b2432;color:white;border:1px solid #43516a;border-radius:6px}.notice{padding:12px;background:#202b3b;border-radius:6px}a.read{color:#778399}</style></head><body><main><h1>디시 아카이브</h1><header>실시간 베스트 · 총 0개 · 매일 방콕 오전 10시 예약<br>개인 열람용 비공식 보관소 · <a href="https://gall.dcinside.com/board/lists/?id=dcbest">원본 실베</a></header><input id="search" type="search" placeholder="이 페이지 제목 검색" aria-label="제목 검색"><nav><a href="index.html">1</a></nav><ul class="posts"></ul><nav><a href="index.html">1</a></nav><script>const seen=JSON.parse(localStorage.getItem('dc-read')||'[]');document.querySelectorAll('[data-post]').forEach(a=>{if(seen.includes(a.dataset.post))a.classList.add('read');a.onclick=()=>{if(!seen.includes(a.dataset.post))seen.push(a.dataset.post);localStorage.setItem('dc-read',JSON.stringify(seen));};});document.getElementById('search').oninput=e=>document.querySelectorAll('li.post').forEach(li=>li.hidden=!li.textContent.toLowerCase().includes(e.target.value.toLowerCase()));</script></main></body></html>
